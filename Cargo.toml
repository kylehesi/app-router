[workspace]
resolver = "2"
members = [
    "crates/common",
    "crates/sys",
    "crates/engine",
    "crates/service",
    "crates/ui",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
publish = false

[workspace.dependencies]
router-common = { path = "crates/common" }
router-sys = { path = "crates/sys" }
router-engine = { path = "crates/engine" }

anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time", "signal"] }
windows-service = "0.8"
wintun = "0.5"
slint = "1.8"
slint-build = "1.8"

[workspace.dependencies.windows-sys]
version = "0.59"
features = [
    "Win32_Foundation",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_NetworkManagement_WiFi",
    "Win32_Networking_WinSock",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_System_Console",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Registry",
    "Win32_System_Threading",
]

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true

name: CI

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Build and test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

      - name: Build release
        run: cargo build --release

      - name: Fetch wintun.dll
        run: ./scripts/fetch-wintun.ps1

      - name: Package
        run: |
          $dir = "router-windows-x64"
          New-Item -ItemType Directory $dir | Out-Null
          Copy-Item target/release/router-service.exe, target/release/router-ui.exe, target/release/wintun.dll, Router.bat, README.md $dir
          Copy-Item third_party/wintun-*/wintun/LICENSE.txt "$dir/wintun-LICENSE.txt"
          Compress-Archive -Path "$dir/*" -DestinationPath "$dir.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: router-windows-x64
          path: router-windows-x64.zip
          if-no-files-found: error

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: router-windows-x64

      - uses: softprops/action-gh-release@v2
        with:
          files: router-windows-x64.zip
          generate_release_notes: true
